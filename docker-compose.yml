services:
  postgres:
    image: postgres:16-alpine
    container_name: pti_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-userpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ProjetoBOPE}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ProjetoBOPE}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
